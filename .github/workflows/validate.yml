# 성취기준 데이터 무결성 게이트 — PR·push마다 scripts/validate.mjs를 돌린다.
# code 형식·key 고유성·필수 필드·학년군 값·manifest 건수를 검사하며 실패하면 머지가 막힌다.
name: validate data

on:
  push:
    branches: [master]
    paths: ['data/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - name: CSV 파생본이 JSON과 같은가
        run: |
          node scripts/build-csv.mjs
          git diff --exit-code --stat data/standards.csv || { echo "data/standards.csv가 standards.json과 다릅니다. node scripts/build-csv.mjs 를 다시 실행해 커밋하세요."; exit 1; }
